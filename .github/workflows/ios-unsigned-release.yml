# iOS Unsigned Release Workflow
# Builds an unsigned IPA-like archive on tag push and uploads to GitHub Releases.
# Trigger: Push a tag with format v* (e.g., v1.0.0)

name: iOS Unsigned Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS (No Code Signing)
        run: |
          xcodebuild \
            -project ESHOTTracker.xcodeproj \
            -scheme ESHOTTracker \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Create Payload folder
        run: |
          mkdir -p Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/ESHOTTracker.app Payload/

      - name: Create unsigned IPA
        run: |
          zip -r ESHOT-Tracker-unsigned.ipa Payload

      - name: Get tag name
        id: get_tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ESHOT Tracker ${{ steps.get_tag.outputs.TAG_NAME }}
          body: |
            ## ESHOT Tracker ${{ steps.get_tag.outputs.TAG_NAME }}
            
            ### Download
            Download the unsigned IPA below.
            
            ### Installation
            This is an **unsigned** IPA. You can install it using:
            - [AltStore](https://altstore.io/)
            - [Sideloadly](https://sideloadly.io/)
            - Other sideloading tools
            
            > ⚠️ **Note**: This IPA is not signed with an Apple Developer certificate.
            > You must sideload it to your device using tools like AltStore.
          files: ESHOT-Tracker-unsigned.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
