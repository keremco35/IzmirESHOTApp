# iOS Unsigned Release Workflow
# Builds an unsigned IPA-like archive on every push and uploads to GitHub Releases.
# Triggers on: push to main/master, pull requests, and v* tags

name: iOS Unsigned Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS (No Code Signing)
        run: |
          xcodebuild \
            -project ESHOTTracker.xcodeproj \
            -scheme ESHOTTracker \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Create Payload folder
        run: |
          mkdir -p Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/ESHOTTracker.app Payload/

      - name: Create unsigned IPA
        run: |
          zip -r ESHOT-Tracker-unsigned.ipa Payload

      # Upload as artifact for every build
      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESHOT-Tracker-unsigned
          path: ESHOT-Tracker-unsigned.ipa

      # Create GitHub Release only on tag push
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ESHOT Tracker ${{ github.ref_name }}
          body: |
            ## ESHOT Tracker ${{ github.ref_name }}
            
            ### Download
            Download the unsigned IPA below.
            
            ### Installation
            This is an **unsigned** IPA. You can install it using:
            - [AltStore](https://altstore.io/)
            - [Sideloadly](https://sideloadly.io/)
            - Other sideloading tools
            
            > ⚠️ **Note**: This IPA is not signed with an Apple Developer certificate.
            > You must sideload it to your device using tools like AltStore.
          files: ESHOT-Tracker-unsigned.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
